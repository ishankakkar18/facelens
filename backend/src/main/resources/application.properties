spring.application.name=facelens-backend
server.port=${PORT:8000}

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

# Local development uses a persistent H2 file in MySQL compatibility mode.
# Production: set SPRING_DATASOURCE_URL to your MySQL/TiDB URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/facelens;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jackson.property-naming-strategy=SNAKE_CASE

# Local .env support (ignored when the file is absent).
spring.config.import=optional:file:.env[.properties]

app.jwt.secret=${SECRET_KEY:change-me-to-a-long-random-string}
app.jwt.expiration-minutes=${ACCESS_TOKEN_EXPIRE_MINUTES:10080}

app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}

app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.storage.upload-dir=${UPLOAD_DIR:uploads}

app.r2.account-id=${R2_ACCOUNT_ID:}
app.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.r2.bucket=${R2_BUCKET:}
app.r2.public-base-url=${R2_PUBLIC_BASE_URL:}
