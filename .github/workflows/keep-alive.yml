name: Keep Render backend awake

# Render free web services sleep after ~15 minutes of inactivity.
# This pings the health endpoint every 10 minutes to keep the API warm.
# GitHub may disable scheduled workflows after long periods without repo activity;
# if that happens, re-enable it from the Actions tab.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 60 https://facelens-api.onrender.com/health || true
